[project]
name = "invocr"
version = "0.1.0"
description = "Invoice OCR service using Gemini"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "google-genai==1.15.0",
    "httpx[socks]==0.28.1",
    "python-multipart==0.0.20",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "lxml==5.3.1",
    "aiofiles==24.1.0",
    "saxonche>=12.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["invocr*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
